# mnist — whole images in one round. Raw bits in: 28*28 pixels of 8 bits each,
# 6272 input wires. No encoding is invented; the genome learns what it needs.
# One wire per digit on the way out.

protocol.kernel        = reference
protocol.ready_start   = 0
protocol.ready_value   = 1

training.selector      = tournament
training.trainer       = none
training.inherit_arena = false

inference.parallel     = false
inference.arena        = static

parameter.population   = 512
parameter.generations  = 20000
parameter.tick_limit   = 32
parameter.address_slack = 2

# Execution: time and memory, never output. Held fixed within a comparison,
# varied freely across one (the determinism test checks that it cannot matter).
execution.threads      = 8              # start-up
execution.backend      = cpu            # compile-time: cpu | gpu
execution.lane_width   = 64             # compile-time: bits per word

task.source            = mnist
task.target            = onehot         # one wire per possible answer
task.rounds            = 1
task.graded            = last

replicate.seeds        = 0,1,2
