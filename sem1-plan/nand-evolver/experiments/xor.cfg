# xor — the reference experiment. Two input wires, one output, one round.
# The name of this experiment is its filename: 'xor'.

# Protocol: train and infer must agree, or a saved genome changes meaning.
protocol.kernel        = reference      # every Nand, every tick
protocol.ready_start   = 0              # value the Harness writes into ready each round
protocol.ready_value   = 1              # value that means ready

# Training: fixed for train, absent from infer.
training.selector      = tournament
training.trainer       = none           # no within-lifetime change
training.inherit_arena = false          # a child starts from a cleared memory space

# Inference: fixed for infer, absent from train.
inference.parallel     = false
inference.arena        = static

# Parameters: numbers, read at start-up.
parameter.population   = 256
parameter.generations  = 2000
parameter.tick_limit   = 8
parameter.address_slack = 2             # wire space beyond what the genome drives

# Task: which problem, and how its data becomes bits.
task.source            = xor
task.target            = raw            # the label's own bits
task.rounds            = 1
task.graded            = last

# Replicate: the seeds this experiment is run with.
replicate.seeds        = 0,1,2,3,4
