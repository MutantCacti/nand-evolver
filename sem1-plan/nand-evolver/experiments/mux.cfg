# mux — a 2:1 multiplexer: three input wires (select, a, b), one output.
# Same protocol and algorithm as xor, so the two are comparable.

protocol.kernel        = reference
protocol.ready_start   = 0
protocol.ready_value   = 1

training.selector      = tournament
training.trainer       = none
training.inherit_arena = false

inference.parallel     = false
inference.arena        = static

parameter.population   = 256
parameter.generations  = 4000
parameter.tick_limit   = 12
parameter.address_slack = 2

task.source            = mux
task.target            = raw
task.rounds            = 1
task.graded            = last

replicate.seeds        = 0,1,2,3,4
