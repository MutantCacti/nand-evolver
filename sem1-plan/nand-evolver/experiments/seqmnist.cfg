# seqmnist — the same images fed one pixel row per round: 28 rounds of 224 input
# wires, only the last graded. The memory space is kept across an example's
# rounds, so a genome must carry what it has seen; it is cleared between
# examples, so no example can depend on another.

protocol.kernel        = reference
protocol.ready_start   = 0
protocol.ready_value   = 1

training.selector      = tournament
training.trainer       = none
training.inherit_arena = false

inference.parallel     = false
inference.arena        = static

parameter.population   = 512
parameter.generations  = 20000
parameter.tick_limit   = 32
parameter.address_slack = 2

task.source            = mnist
task.target            = onehot
task.rounds            = 28             # one image row per round
task.graded            = last           # only the final round is scored

replicate.seeds        = 0,1,2
