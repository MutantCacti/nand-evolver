# seqmnist — the same images fed one pixel row per round: 28 rounds of 224 input
# wires, only the last graded. The memory space is kept across an example's
# rounds, so a genome must carry what it has seen; it is reset between
# examples, so no example can depend on another. Expect results only once
# P2 brings lanes (execution.lane_width = word_bits).
# This file is embedded in train. No seed appears here: a seed names
# a run of this experiment, not the experiment.

# Protocol: train and infer must agree, or a saved genome changes meaning.
protocol.kernel          = reference         # every Nand, every tick
protocol.ready_start     = 0                 # value the Harness writes into ready each round
protocol.ready_value     = 1                 # value that means ready

# Parameters: numbers, read at start-up from the experiment file embedded in train.
parameter.population     = 512
parameter.generations    = 20000
parameter.tick_limit     = 32
parameter.initial_nands  = 256
parameter.max_nands      = 4096              # capacity: the inert reserve lies between live and max
parameter.internal_wires = 4096
parameter.mutation_rate  = 50                # expected mutations per thousand live Nands

# Execution: time and memory, never output (test_determinism checks that it cannot matter).
execution.threads        = 8                 # start-up
execution.bits_per_word  = 8                 # compile-time: bits per wire
execution.lane_width     = 1                 # compile-time: examples per word: 1 or bits_per_word; 1 in P1

# Task: which problem, and how its data becomes bits. Read by the Driver only;
# train learns i, m, rounds and graded rounds from the Dataset file.
task.source              = mnist
task.target              = onehot            # one wire per possible answer
task.rounds              = 28                # one image row per round
task.graded              = 27                # 0-based: the last of 28 rounds
